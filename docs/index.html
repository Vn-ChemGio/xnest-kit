<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>xnest-kit - NestJS Toolkit</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="A modular, production-ready NestJS toolkit with Bootstrap, Auth, SaaS, and Infrastructure integrations.">

    :root {
      --base-font-size: 15px;
      --theme-color: #E0234E;
      --link-color: #E0234E;
      --sidebar-width: 260px;
      --sidebar-nav-link-color--active: #E0234E;
      --sidebar-nav-link-border-color--active: #E0234E;
      --cover-background-color: linear-gradient(135deg, #E0234E 0%, #c41e3a 100%);
      --cover-heading-color: #fff;
      --cover-color: #fff;
      --cover-link-color: #fff;
    }
    .markdown-section code {
      border-radius: 4px;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-alpha {
      background: #fff3cd;
      color: #856404;
    }
    .badge-stable {

      color: #155724;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'xnest-kit',
      repo: 'https://github.com/Vn-ChemGio/xnest-kit',
      loadSidebar: true,
      subMaxLevel: 3,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      search: {
        placeholder: 'Search',
        noData: 'No results found',
        depth: 3,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!',
      },
      tabs: {
        persist: true,
        sync: true,
      },
    };
  </script>
  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
